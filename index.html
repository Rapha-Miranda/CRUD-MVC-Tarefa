<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas MVC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .btn {
            border-radius: 8px;
        }

        .list-group-item {
            transition: all 0.2s ease-in-out;
            border: none;
            border-bottom: 1px solid #efefef;
        }

        .list-group-item:last-child {
            border-bottom: none;
        }

        .list-group-item:hover {
            transform: translateX(4px);
            background-color: #f8f9fa;
        }

        .header-gradient {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            border-radius: 12px 12px 0 0 !important;
        }
    </style>
</head>

<body class="py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card mb-4">
            <div class="card-header header-gradient py-3">
                <h3 class="mb-0 text-center fw-bold">Minhas Tarefas de Hoje</h3>
            </div>
            <div class="card-body p-4">
                <form id="form-tarefa" class="d-flex gap-2 mb-4">
                    <input type="text" id="descricao" class="form-control" placeholder="O que precisa ser feito?"
                        required>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">Adicionar</button>
                </form>

                <ul id="lista-tarefas" class="list-group list-group-flush rounded-3">
                </ul>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Editar Tarefa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="edit-tarefa-input" class="form-control" placeholder="Descrição da tarefa">
                    <input type="hidden" id="edit-tarefa-id">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-salvar-edicao">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Excluir Tarefa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Deseja realmente excluir esta tarefa?
                    <input type="hidden" id="delete-tarefa-id">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btn-confirmar-exclusao">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./main.mjs"></script>
</body>

</html>
